name: Build and publish installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build versioned installer
        shell: pwsh
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:VERSION_TAG -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Release tags must use the vMAJOR.MINOR.PATCH format."
          }

          $outputDirectory = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Force -Path $outputDirectory | Out-Null
          & iscc "/DMyAppVersion=$version" "/O$outputDirectory" "installer\CmdPalStartSearch.iss"
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/BetterStartMenuSearch-Setup-*.exe
